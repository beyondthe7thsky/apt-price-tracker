<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>APT Listings Report</title>
  <style>
    :root{--bg:#f5f8fc;--line:#dbe3ee;--text:#1f2937;--muted:#64748b;--card:#fff;--shadow:0 10px 24px rgba(31,41,55,.06)}
    *{box-sizing:border-box}
    body{margin:0;padding:24px;color:var(--text);background:radial-gradient(circle at 20% -10%,#dbeafe 0,transparent 36%),radial-gradient(circle at 90% 0%,#dcfce7 0,transparent 34%),var(--bg);font-family:"Pretendard","Apple SD Gothic Neo","Segoe UI",sans-serif}
    .wrap{max-width:1820px;margin:0 auto}
    h1{margin:0 0 6px;font-size:30px;letter-spacing:-.02em}
    .meta{color:var(--muted);margin:0 0 14px}
    .legend{margin:-6px 0 14px;padding:10px 12px;border:1px solid #d8e2f0;border-radius:10px;background:#f8fbff;color:#334155;font-size:13px}
    .toolbar{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;box-shadow:var(--shadow)}
    .toolbar input,.toolbar select,.toolbar button{border:1px solid #cfd8e6;border-radius:10px;padding:10px 12px;font-size:14px;background:#fff}
    .toolbar button{cursor:pointer;background:#0f172a;color:#fff;border-color:#0f172a;font-weight:700}
    .stats{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px;margin:14px 0}
    .stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;box-shadow:var(--shadow)}
    .stat .k{font-size:12px;color:var(--muted)} .stat .v{font-size:20px;font-weight:800}
    .region{--accent:#475569;background:var(--card);border:1px solid var(--line);border-left:6px solid var(--accent);border-radius:14px;margin-bottom:12px;overflow:hidden;box-shadow:var(--shadow)}
    .head{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 13px;border-bottom:1px solid var(--line);background:linear-gradient(90deg,rgba(15,23,42,.03),transparent 60%);cursor:pointer}
    .head:hover{background:linear-gradient(90deg,rgba(15,23,42,.06),transparent 60%)}
    .head:focus-visible{outline:2px solid #2563eb;outline-offset:-2px}
    .title-wrap{display:flex;align-items:center;gap:8px}
    .collapse-caret{display:inline-flex;width:18px;justify-content:center;color:#334155;font-weight:900}
    .collapse-label{font-size:12px;color:#64748b;font-weight:700}
    .region.collapsed .head{border-bottom:0}
    .title{font-size:18px;font-weight:800}
    .chips{display:flex;gap:6px;flex-wrap:wrap}
    .chip{padding:3px 8px;border-radius:999px;font-size:12px;font-weight:700;border:1px solid}
    .chip.city{background:rgba(15,23,42,.06);color:#0f172a;border-color:rgba(15,23,42,.12)}
    .chip.s-bargain{background:#ffe4e6;color:#9f1239;border-color:#fecdd3}
    .chip.s-cheap{background:#ecfeff;color:#155e75;border-color:#a5f3fc}
    .chip.s-normal{background:#f8fafc;color:#475569;border-color:#cbd5e1}
    .table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
    table{width:100%;min-width:1520px;border-collapse:collapse;font-size:13px}
    th,td{border-bottom:1px solid #edf1f7;padding:8px 10px;text-align:left;vertical-align:top}
    th{background:#f8fafc;color:#475569;position:sticky;top:0;z-index:2}
    th.sortable{cursor:pointer;user-select:none}
    th.sortable .sort-indicator{margin-left:4px;color:#94a3b8;font-size:11px;font-weight:700}
    th.sortable.active .sort-indicator{color:#0f172a}
    td.price{font-weight:800;white-space:nowrap}
    td.dim{color:var(--muted);white-space:nowrap}
    td.city-col,td.floor-col,td.link-col{white-space:nowrap}
    td.title-col{min-width:180px}
    td.feature{min-width:260px;max-width:420px;color:#334155;white-space:normal;word-break:keep-all;line-height:1.35}
    td.tags{min-width:180px;max-width:300px;color:#475569;white-space:normal;word-break:keep-all;line-height:1.35}
    td.area-col{min-width:250px}
    td.link-col a{display:inline-block;min-width:42px}
    .badge{display:inline-block;padding:3px 7px;border-radius:999px;font-size:11px;font-weight:800;border:1px solid}
    .b-bargain{background:#ffe4e6;color:#9f1239;border-color:#fecdd3}
    .b-cheap{background:#ecfeff;color:#155e75;border-color:#a5f3fc}
    .b-normal{background:#f8fafc;color:#475569;border-color:#cbd5e1}
    .status-active{background:#eff6ff;color:#1d4ed8;border-color:#bfdbfe}
    .status-relisted{background:#f0fdf4;color:#166534;border-color:#bbf7d0}
    .diff-neg{color:#16a34a;font-weight:700}
    .diff-pos{color:#dc2626;font-weight:700}
    .region-footer{display:flex;justify-content:center;padding:12px;border-top:1px solid var(--line);background:#fbfdff}
    .load-more{border:1px solid #94a3b8;border-radius:10px;padding:7px 12px;background:#fff;color:#334155;font-weight:700;cursor:pointer}
    .load-more:hover{background:#f1f5f9}
    .list-footer{display:flex;justify-content:center;padding:10px 0 16px}
    .hint{font-size:12px;color:#64748b;text-align:center;margin-top:6px}
    .empty{background:#fff;border:1px dashed #cbd5e1;border-radius:12px;padding:24px;color:#64748b;text-align:center}
    a{color:#1f6feb;text-decoration:none} a:hover{text-decoration:underline}
    @media (max-width:1536px){.toolbar{grid-template-columns:repeat(4,minmax(0,1fr))}.stats{grid-template-columns:repeat(3,minmax(0,1fr))}}
    @media (max-width:900px){
      body{padding:12px}
      h1{font-size:24px}
      .meta{font-size:13px}
      .legend{font-size:12px}
      .toolbar{grid-template-columns:1fr;padding:10px}
      .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
      .stat{padding:10px}
      .stat .v{font-size:18px}
      .head{flex-direction:column;align-items:flex-start}
      .title-wrap{width:100%}
      .table-wrap{overflow-x:visible}
      table{min-width:0}
      table, thead, tbody, tr, th, td{display:block;width:100%}
      thead{display:none}
      tbody{padding:8px}
      tr{background:#fff;border:1px solid #e5eaf3;border-radius:12px;padding:8px;margin-bottom:10px}
      td{display:flex;gap:10px;justify-content:space-between;align-items:flex-start;border:0;border-bottom:1px dashed #edf1f7;padding:6px 2px;white-space:normal}
      td:last-child{border-bottom:0}
      td::before{content:attr(data-label);min-width:84px;flex:0 0 84px;color:#64748b;font-weight:700}
      td.price{white-space:normal}
      td.dim{white-space:normal}
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>오늘의 아파트 매물 리포트</h1>
    <div class="meta">기준시각: 2026-03-11 12:21 KST / 노출 매물 23133건 / 필터: 없음</div>
    <div class="legend">평균대비 = (매물가 - 단지평균가) / 단지평균가 × 100 · 급매: -10.0% 이하 · 저렴: -5.0% 이하</div>

    <div class="toolbar">
      <select id="city"></select>
      <select id="region"></select>
      <select id="priceBand"><option value="">가격대(전체)</option><option>8억 미만</option><option>8~9억대</option><option>9~10억대</option><option>10~12억대</option><option>12억 이상</option></select>
      <select id="pyeongBand"><option value="">평형(공급면적 기준,전체)</option><option>20평대</option><option>30평대</option></select>
      <select id="signal"><option value="">판단(전체)</option><option>급매</option><option>저렴</option><option>보통</option></select>
      <select id="status"><option value="">상태(전체)</option><option>판매중</option><option>다시 등록된 매물(판매중)</option></select>
      <input id="q" placeholder="지역/단지명 검색"/>
      <button id="resetBtn">필터 초기화</button>
    </div>

    <div class="stats">
      <div class="stat"><div class="k">노출 매물</div><div class="v" id="sTotal">0</div></div>
      <div class="stat"><div class="k">지역 수</div><div class="v" id="sRegions">0</div></div>
      <div class="stat"><div class="k">급매</div><div class="v" id="sBargain">0</div></div>
      <div class="stat"><div class="k">저렴</div><div class="v" id="sCheap">0</div></div>
      <div class="stat"><div class="k">다시 등록된 매물(판매중)</div><div class="v" id="sRelisted">0</div></div>
      <div class="stat"><div class="k">거래종결 후보</div><div class="v">4</div></div>
      <div class="stat"><div class="k">거래종결 추정</div><div class="v">0</div></div>
    </div>

    <div id="regions"></div>
  </div>

  <script>
    let RAW = [];
    const DATA_URL = 'report-data.json';
    const cityEl=document.getElementById('city'),regionEl=document.getElementById('region'),priceEl=document.getElementById('priceBand'),pyeongEl=document.getElementById('pyeongBand'),signalEl=document.getElementById('signal'),statusEl=document.getElementById('status'),qEl=document.getElementById('q'),regionsEl=document.getElementById('regions');
    const resetBtn=document.getElementById('resetBtn');
    const sTotal=document.getElementById('sTotal'),sRegions=document.getElementById('sRegions'),sBargain=document.getElementById('sBargain'),sCheap=document.getElementById('sCheap');
    const CITY_COLOR={"수원":"#2563eb","용인수지":"#0f766e","서울양천":"#9333ea","서울강서":"#0284c7","서울영등포":"#0891b2","서울동작":"#dc2626","서울관악":"#ea580c","서울구로":"#16a34a","서울금천":"#ca8a04","서울성동":"#4f46e5","서울마포":"#7c3aed","서울용산":"#be123c","서울은평":"#0d9488","서울강동":"#1d4ed8","서울동대문":"#c2410c","서울광진":"#7e22ce","서울서대문":"#0f766e","서울성북":"#475569","서울강남":"#7c2d12","서울서초":"#b45309","서울송파":"#0f766e","성남판교":"#0f766e","성남분당":"#2563eb","성남수정":"#be123c","성남중원":"#0891b2","안양":"#ea580c"};
    const SORT_DEFAULT={key:'price',dir:'asc'};
    const FIRST_DIR={city:'asc',title:'asc',featureDesc:'asc',tagText:'asc',price:'asc',avgPrice:'desc',diffPct:'asc',signal:'asc',statusLabel:'asc',areaSupplyPyeong:'desc'};
    const sortState={...SORT_DEFAULT};
    const IS_MOBILE=window.matchMedia('(max-width: 900px)').matches;
    const REGION_INITIAL_ROWS=IS_MOBILE?10:30;
    const REGION_ROWS_STEP=IS_MOBILE?10:30;
    const REGION_INITIAL_BLOCKS=IS_MOBILE?2:8;
    const REGION_BLOCK_STEP=IS_MOBILE?2:8;
    const regionVisible=new Map();
    const collapsedRegions=new Set();
    let visibleRegionBlocks=REGION_INITIAL_BLOCKS;
    const esc=(s)=>String(s??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;');
    const uniq=(a)=>Array.from(new Set(a)).sort((x,y)=>String(x).localeCompare(String(y),'ko'));
    const shortFeature=(s)=>{const t=String(s??'').trim(); return t ? (t.length>56 ? `${t.slice(0,56)}…` : t) : '-';};
    const mapUrl=(row)=>`https://map.naver.com/p/search/${encodeURIComponent(`${row.region} ${row.title}`)}`;
    const fullUrl=(u)=>{const t=String(u??'').trim(); if(!t) return '#'; return t.startsWith('/') ? `https://m.land.naver.com${t}` : t;};
    const signalClass=(v)=>v==='급매'?'b-bargain':(v==='저렴'?'b-cheap':'b-normal');
    const statusClass=(v)=>v==='다시 등록된 매물(판매중)'?'status-relisted':'status-active';
    function cityColor(city){ if(CITY_COLOR[city]) return CITY_COLOR[city]; const palette=["#2563eb","#0f766e","#9333ea","#0284c7","#dc2626","#16a34a","#ea580c"]; let h=0; for(const c of city) h=(h*31+c.charCodeAt(0))>>>0; return palette[h%palette.length]; }
    function fillCities(){const c=uniq(RAW.map(x=>x.city));cityEl.innerHTML=`<option value="">도시(전체)</option>`+c.map(v=>`<option>${esc(v)}</option>`).join('');}
    function fillRegions(){const city=cityEl.value;const src=city?RAW.filter(x=>x.city===city):RAW;const r=uniq(src.map(x=>x.region));const prev=regionEl.value;regionEl.innerHTML=`<option value="">지역(전체)</option>`+r.map(v=>`<option>${esc(v)}</option>`).join('');if(r.includes(prev))regionEl.value=prev;}
    function filtered(){const city=cityEl.value,region=regionEl.value,priceBand=priceEl.value,pyeongBand=pyeongEl.value,signal=signalEl.value,status=statusEl.value,q=qEl.value.trim().toLowerCase();return RAW.filter(x=>{if(city&&x.city!==city)return false;if(region&&x.region!==region)return false;if(priceBand&&x.priceBand!==priceBand)return false;if(pyeongBand&&x.pyeongBand!==pyeongBand)return false;if(signal&&x.signal!==signal)return false;if(status&&x.statusLabel!==status)return false;if(q&&!`${x.region} ${x.title} ${x.featureDesc || ''} ${x.tagText || ''}`.toLowerCase().includes(q))return false;return true;});}
    function compareRows(a,b,key){
      if(['city','title','featureDesc','tagText','signal','statusLabel','region'].includes(key)){
        return String(a[key]??'').localeCompare(String(b[key]??''),'ko');
      }
      const an=Number(a[key]??0), bn=Number(b[key]??0);
      if(!Number.isFinite(an) || !Number.isFinite(bn)) return 0;
      return an-bn;
    }
    function sortRows(rows){
      const arr=[...rows];
      arr.sort((a,b)=>{
        const cmp=compareRows(a,b,sortState.key);
        if(cmp!==0) return sortState.dir==='asc' ? cmp : -cmp;
        return Number(a.price)-Number(b.price);
      });
      return arr;
    }
    function sortIndicator(key){
      if(sortState.key!==key) return '↕';
      return sortState.dir==='asc' ? '↑' : '↓';
    }
    function diffText(v){const n=Number(v||0);const sign=n>0?'+':'';return `${sign}${n.toFixed(1)}%`;}
    function diffClass(v){return Number(v)<=0?'diff-neg':'diff-pos';}
    function resetRegionVisible(){regionVisible.clear();visibleRegionBlocks=REGION_INITIAL_BLOCKS;}
    function toggleRegionCollapsed(regionName){
      if(collapsedRegions.has(regionName)) collapsedRegions.delete(regionName);
      else collapsedRegions.add(regionName);
    }
    function render(){
      const rows=sortRows(filtered());
      const g=new Map();
      for(const r of rows){if(!g.has(r.region))g.set(r.region,[]);g.get(r.region).push(r);}
      for(const key of [...collapsedRegions]){
        if(!g.has(key)) collapsedRegions.delete(key);
      }

      sTotal.textContent=String(rows.length);
      sRegions.textContent=String(g.size);
      sBargain.textContent=String(rows.filter(x=>x.signal==='급매').length);
      sCheap.textContent=String(rows.filter(x=>x.signal==='저렴').length);

      if(!rows.length){regionsEl.innerHTML='<div class="empty">조건에 맞는 데이터가 없습니다.</div>';return;}
      const entries=[...g.entries()];
      const visibleEntries=entries.slice(0, visibleRegionBlocks);
      const hiddenRegions=entries.length-visibleEntries.length;

      regionsEl.innerHTML=visibleEntries.map(([name,items])=>{
        const city=items[0]?.city||'';
        const accent=cityColor(city);
        const countBargain=items.filter(x=>x.signal==='급매').length;
        const countCheap=items.filter(x=>x.signal==='저렴').length;
        const countNormal=items.filter(x=>x.signal==='보통').length;
        const chips=`<span class="chip city">${esc(city)}</span><span class="chip s-bargain">급매 ${countBargain}</span><span class="chip s-cheap">저렴 ${countCheap}</span><span class="chip s-normal">보통 ${countNormal}</span>`;
        if(!regionVisible.has(name)) regionVisible.set(name, REGION_INITIAL_ROWS);
        const visibleCount=regionVisible.get(name) || REGION_INITIAL_ROWS;
        const visibleItems=items.slice(0, visibleCount);
        const hiddenCount=items.length - visibleItems.length;
        const regionKey=encodeURIComponent(name);
        const collapsed=collapsedRegions.has(name);
        const caret=collapsed ? '▸' : '▾';
        const collapseLabel=collapsed ? '펼치기' : '접기';

        const rowsHtml=visibleItems.map(it=>`<tr><td data-label="도시" class="city-col">${esc(it.city)}</td><td data-label="단지/매물" class="title-col">${esc(it.title)}</td><td data-label="특징" class="feature">${esc(shortFeature(it.featureDesc))}</td><td data-label="태그" class="tags">${esc(it.tagText || '-')}</td><td data-label="매물가" class="price">${esc(it.priceText)}</td><td data-label="단지 평균가">${esc(it.avgPriceText)}</td><td data-label="평균대비" class="${diffClass(it.diffPct)}">${esc(diffText(it.diffPct))}</td><td data-label="판단"><span class="badge ${signalClass(it.signal)}">${esc(it.signal)}</span></td><td data-label="상태"><span class="badge ${statusClass(it.statusLabel)}">${esc(it.statusLabel)}</span></td><td data-label="평형(공급/전용)" class="dim area-col">${esc(it.areaSupplyPyeongText)}평(${esc(it.areaSupplySqmText)}㎡) / ${esc(it.areaExclusivePyeongText)}평(${esc(it.areaExclusiveSqmText)}㎡)</td><td data-label="층" class="dim floor-col">${esc(it.floor)}</td><td data-label="매물" class="link-col"><a href="${esc(fullUrl(it.url))}" target="_blank">상세보기</a></td><td data-label="지도" class="link-col"><a href="${esc(mapUrl(it))}" target="_blank">지도</a></td></tr>`).join('');

        const headerCell=(label,key='')=>{
          if(!key) return `<th>${label}</th>`;
          const active=sortState.key===key ? 'active' : '';
          return `<th class="sortable ${active}" data-sort="${key}">${label}<span class="sort-indicator">${sortIndicator(key)}</span></th>`;
        };
        const headerHtml=`<tr>${headerCell('도시','city')}${headerCell('단지/매물','title')}${headerCell('특징','featureDesc')}${headerCell('태그','tagText')}${headerCell('매물가','price')}${headerCell('단지 평균가','avgPrice')}${headerCell('평균대비','diffPct')}${headerCell('판단','signal')}${headerCell('상태','statusLabel')}${headerCell('평형(공급/전용)','areaSupplyPyeong')}${headerCell('층')}${headerCell('매물')}${headerCell('지도')}</tr>`;

        const footerHtml = hiddenCount > 0 && !collapsed
          ? `<div class="region-footer"><button type="button" class="load-more" data-region-key="${regionKey}">+ ${Math.min(REGION_ROWS_STEP, hiddenCount)}건 더보기 (남은 ${hiddenCount}건)</button></div>`
          : '';
        const contentHtml = collapsed ? '' : `<div class="table-wrap"><table><thead>${headerHtml}</thead><tbody>${rowsHtml}</tbody></table></div>${footerHtml}`;
        return `<section class="region ${collapsed ? 'collapsed' : ''}" style="--accent:${accent};"><div class="head" data-role="region-head" data-region-key="${regionKey}" role="button" tabindex="0" aria-expanded="${collapsed ? 'false' : 'true'}"><div class="title-wrap"><span class="collapse-caret">${caret}</span><div class="title">${esc(name)} <span style="color:#64748b;font-size:13px;">(${items.length}건)</span></div><span class="collapse-label">${collapseLabel}</span></div><div class="chips">${chips}</div></div>${contentHtml}</section>`;
      }).join('') + (hiddenRegions>0 ? `<div class="list-footer"><button type="button" class="load-more" data-role="load-more-regions">+ 지역 ${Math.min(REGION_BLOCK_STEP, hiddenRegions)}개 더보기 (남은 ${hiddenRegions}개)</button></div><div class="hint">모바일/저사양 브라우저 안정성을 위해 지역별로 나눠 렌더링합니다.</div>` : '');
    }

    regionsEl.addEventListener('click',(event)=>{
      const regionHead=event.target.closest('[data-role="region-head"]');
      if(regionHead){
        const key=decodeURIComponent(regionHead.dataset.regionKey || '');
        if(!key) return;
        toggleRegionCollapsed(key);
        render();
        return;
      }
      const loadRegionBtn=event.target.closest('button[data-role="load-more-regions"]');
      if(loadRegionBtn){
        visibleRegionBlocks += REGION_BLOCK_STEP;
        render();
        return;
      }
      const loadMoreBtn=event.target.closest('button.load-more');
      if(loadMoreBtn){
        const key=decodeURIComponent(loadMoreBtn.dataset.regionKey || '');
        const current=regionVisible.get(key) || REGION_INITIAL_ROWS;
        regionVisible.set(key, current + REGION_ROWS_STEP);
        render();
        return;
      }
      const th=event.target.closest('th[data-sort]');
      if(!th) return;
      const key=th.dataset.sort;
      if(!key) return;
      if(sortState.key===key){
        sortState.dir = sortState.dir==='asc' ? 'desc' : 'asc';
      }else{
        sortState.key = key;
        sortState.dir = FIRST_DIR[key] || 'asc';
      }
      render();
    });

    regionsEl.addEventListener('keydown',(event)=>{
      const regionHead=event.target.closest('[data-role="region-head"]');
      if(!regionHead) return;
      if(event.key!=='Enter' && event.key!==' ') return;
      event.preventDefault();
      const key=decodeURIComponent(regionHead.dataset.regionKey || '');
      if(!key) return;
      toggleRegionCollapsed(key);
      render();
    });

    cityEl.addEventListener('change',()=>{fillRegions();resetRegionVisible();render();});
    [regionEl,priceEl,pyeongEl,signalEl,statusEl].forEach(el=>el.addEventListener('change',()=>{resetRegionVisible();render();}));
    let qTimer=0;
    qEl.addEventListener('input',()=>{window.clearTimeout(qTimer);qTimer=window.setTimeout(()=>{resetRegionVisible();render();},180);});
    resetBtn.addEventListener('click',()=>{cityEl.value='';fillRegions();regionEl.value='';priceEl.value='';pyeongEl.value='';signalEl.value='';statusEl.value='';qEl.value='';sortState.key=SORT_DEFAULT.key;sortState.dir=SORT_DEFAULT.dir;resetRegionVisible();render();});

    async function init(){
      try{
        const response = await fetch(DATA_URL, {cache:'no-store'});
        if(!response.ok) throw new Error(`HTTP ${response.status}`);
        const loaded = await response.json();
        RAW = Array.isArray(loaded) ? loaded : [];
        fillCities();
        fillRegions();
        render();
      }catch(error){
        console.error('report init failed', error);
        regionsEl.innerHTML='<div class="empty">데이터를 불러오지 못했습니다. 잠시 후 새로고침해 주세요.</div>';
      }
    }
    init();
  </script>
</body>
</html>
