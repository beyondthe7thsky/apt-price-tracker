name: send-teams-from-json

on:
  schedule:
    # KST 13:00 (평일) = UTC 04:00 (월~금)
    - cron: "0 4 * * 1-5"
  workflow_dispatch:
    inputs:
      region_filter:
        description: "지역명 포함 필터 (예: 수원_매탄동). 비우면 전체"
        required: false
        default: ""

jobs:
  build-report:
    runs-on: [self-hosted, macOS, ARM64]
    permissions:
      contents: read
    outputs:
      total_count: ${{ steps.build.outputs.total_count }}
      bargain_count: ${{ steps.build.outputs.bargain_count }}
      cheap_count: ${{ steps.build.outputs.cheap_count }}
      relisted_count: ${{ steps.build.outputs.relisted_count }}
      off_market_candidate_count: ${{ steps.build.outputs.off_market_candidate_count }}
      off_market_count: ${{ steps.build.outputs.off_market_count }}
      run_label: ${{ steps.build.outputs.run_label }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build HTML report
        id: build
        shell: bash
        env:
          REGION_FILTER: ${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.region_filter || '') || '' }}
        run: |
          python3 - <<'PY'
          import datetime
          import html
          import json
          import os
          import pathlib

          path = pathlib.Path("data/apt-listings.json")
          if not path.exists():
              raise SystemExit("data/apt-listings.json not found")

          with path.open("r", encoding="utf-8") as f:
              data = json.load(f)

          if not isinstance(data, list):
              raise SystemExit("data/apt-listings.json must be a JSON array")

          region_filter = (os.getenv("REGION_FILTER") or "").strip()

          def as_int(v, default=0):
              try:
                  return int(v)
              except Exception:
                  return default

          def as_float(v, default=0.0):
              try:
                  return float(v)
              except Exception:
                  return default

          def format_price(price_man):
              p = as_int(price_man, 0)
              if p < 10_000:
                  return f"{p}만"
              eok = p // 10_000
              man = p % 10_000
              return f"{eok}억" if man == 0 else f"{eok}억 {man}만"

          def format_area_sqm(value):
              v = as_float(value, 0.0)
              if v <= 0:
                  return "-"
              text = f"{v:.2f}".rstrip("0").rstrip(".")
              return text

          def format_area_pyeong(value):
              v = as_float(value, 0.0)
              if v <= 0:
                  return "-"
              py = v / 3.3058
              text = f"{py:.1f}".rstrip("0").rstrip(".")
              return text

          def derive_pyeong(item):
              supply = as_float(item.get("areaSupplySqm", 0.0), 0.0)
              if supply > 0:
                  return supply / 3.3058
              return float(as_int(item.get("pyeong", 0), 0))

          def normalize_status(v):
              s = str(v or "ACTIVE").strip().upper()
              valid = {"ACTIVE", "RELISTED", "OFF_MARKET_CANDIDATE", "OFF_MARKET"}
              return s if s in valid else "ACTIVE"

          def status_label(status):
              return {
                  "ACTIVE": "판매중",
                  "RELISTED": "다시 등록된 매물(판매중)",
                  "OFF_MARKET_CANDIDATE": "거래종결 후보",
                  "OFF_MARKET": "거래종결 추정",
              }.get(status, "판매중")

          listings = [x for x in data if isinstance(x, dict)]
          if region_filter:
              listings = [x for x in listings if region_filter in str(x.get("regionName", ""))]

          listings = [x for x in listings if 20.0 <= derive_pyeong(x) <= 39.999]

          status_counts = {
              "ACTIVE": 0,
              "RELISTED": 0,
              "OFF_MARKET_CANDIDATE": 0,
              "OFF_MARKET": 0,
          }
          for it in listings:
              status_counts[normalize_status(it.get("status"))] += 1

          live_statuses = {"ACTIVE", "RELISTED"}
          live_listings = [x for x in listings if normalize_status(x.get("status")) in live_statuses]
          live_listings.sort(key=lambda x: str(x.get("updatedAt", "")), reverse=True)

          def complex_key(item):
              region = str(item.get("regionName", "")).strip()
              hscp_no = str(item.get("hscpNo", "")).strip()
              title = str(item.get("title", "")).strip()
              return f"{region}::{hscp_no or title}"

          complex_price_map = {}
          for it in live_listings:
              key = complex_key(it)
              p = as_int(it.get("price", 0), 0)
              if p <= 0:
                  continue
              complex_price_map.setdefault(key, []).append(p)

          def price_band_label(price):
              if price < 80_000:
                  return "8억 미만"
              if price < 90_000:
                  return "8~9억대"
              if price < 100_000:
                  return "9~10억대"
              if price < 120_000:
                  return "10~12억대"
              return "12억 이상"

          def pyeong_band_label(p):
              if 20.0 <= p < 30.0:
                  return "20평대"
              if 30.0 <= p < 40.0:
                  return "30평대"
              return "기타"

          BARGAIN_THRESHOLD_PCT = -10.0
          CHEAP_THRESHOLD_PCT = -5.0

          def price_signal(diff_pct):
              if diff_pct <= BARGAIN_THRESHOLD_PCT:
                  return "급매"
              if diff_pct <= CHEAP_THRESHOLD_PCT:
                  return "저렴"
              return "보통"

          report_rows = []
          bargain_count = 0
          cheap_count = 0

          for it in live_listings:
              region = str(it.get("regionName", ""))
              city = region.split("_", 1)[0] if "_" in region else region

              price = as_int(it.get("price", 0), 0)
              area_supply_sqm = as_float(it.get("areaSupplySqm", 0.0), 0.0)
              area_exclusive_sqm = as_float(it.get("areaExclusiveSqm", it.get("areaSqm", 0.0)), 0.0)
              pyeong = derive_pyeong(it)

              prices = complex_price_map.get(complex_key(it), [])
              avg_price = round(sum(prices) / len(prices)) if prices else 0
              diff_pct = ((price - avg_price) / avg_price * 100.0) if avg_price > 0 else 0.0
              signal = price_signal(diff_pct)

              if signal == "급매":
                  bargain_count += 1
              elif signal == "저렴":
                  cheap_count += 1

              status = normalize_status(it.get("status"))
              report_rows.append(
                  {
                      "city": city,
                      "region": region,
                      "title": str(it.get("title", "")),
                      "hsehCnt": as_int(it.get("hsehCnt", 0), 0),
                      "price": price,
                      "priceText": format_price(price),
                      "avgPrice": avg_price,
                      "avgPriceText": format_price(avg_price) if avg_price > 0 else "-",
                      "diffPct": round(diff_pct, 2),
                      "signal": signal,
                      "status": status,
                      "statusLabel": status_label(status),
                      "priceBand": price_band_label(price),
                      "pyeong": pyeong,
                      "pyeongBand": pyeong_band_label(pyeong),
                      "areaSupplySqm": area_supply_sqm,
                      "areaExclusiveSqm": area_exclusive_sqm,
                      "areaSupplySqmText": format_area_sqm(area_supply_sqm),
                      "areaExclusiveSqmText": format_area_sqm(area_exclusive_sqm),
                      "areaSupplyPyeong": (area_supply_sqm / 3.3058) if area_supply_sqm > 0 else 0.0,
                      "areaExclusivePyeong": (area_exclusive_sqm / 3.3058) if area_exclusive_sqm > 0 else 0.0,
                      "areaSupplyPyeongText": format_area_pyeong(area_supply_sqm),
                      "areaExclusivePyeongText": format_area_pyeong(area_exclusive_sqm),
                      "floor": str(it.get("floor", "")),
                      "url": str(it.get("url", "")),
                      "updatedAt": str(it.get("updatedAt", "")),
                  }
              )

          now = datetime.datetime.now(datetime.timezone(datetime.timedelta(hours=9)))
          run_label = now.strftime("%Y-%m-%d %H:%M KST")

          data_json = json.dumps(report_rows, ensure_ascii=False)
          html_template = """<!doctype html>
          <html lang=\"ko\">
          <head>
            <meta charset=\"utf-8\" />
            <meta name=\"viewport\" content=\"width=device-width, initial-scale=1\" />
            <title>APT Listings Report</title>
            <style>
              :root{--bg:#f5f8fc;--line:#dbe3ee;--text:#1f2937;--muted:#64748b;--card:#fff;--shadow:0 10px 24px rgba(31,41,55,.06)}
              *{box-sizing:border-box}
              body{margin:0;padding:24px;color:var(--text);background:radial-gradient(circle at 20% -10%,#dbeafe 0,transparent 36%),radial-gradient(circle at 90% 0%,#dcfce7 0,transparent 34%),var(--bg);font-family:\"Pretendard\",\"Apple SD Gothic Neo\",\"Segoe UI\",sans-serif}
              .wrap{max-width:1440px;margin:0 auto}
              h1{margin:0 0 6px;font-size:30px;letter-spacing:-.02em}
              .meta{color:var(--muted);margin:0 0 14px}
              .legend{margin:-6px 0 14px;padding:10px 12px;border:1px solid #d8e2f0;border-radius:10px;background:#f8fbff;color:#334155;font-size:13px}
              .toolbar{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;box-shadow:var(--shadow)}
              .toolbar input,.toolbar select,.toolbar button{border:1px solid #cfd8e6;border-radius:10px;padding:10px 12px;font-size:14px;background:#fff}
              .toolbar button{cursor:pointer;background:#0f172a;color:#fff;border-color:#0f172a;font-weight:700}
              .stats{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px;margin:14px 0}
              .stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;box-shadow:var(--shadow)}
              .stat .k{font-size:12px;color:var(--muted)} .stat .v{font-size:20px;font-weight:800}
              .region{--accent:#475569;background:var(--card);border:1px solid var(--line);border-left:6px solid var(--accent);border-radius:14px;margin-bottom:12px;overflow:hidden;box-shadow:var(--shadow)}
              .head{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 13px;border-bottom:1px solid var(--line);background:linear-gradient(90deg,rgba(15,23,42,.03),transparent 60%)}
              .title{font-size:18px;font-weight:800}
              .chips{display:flex;gap:6px;flex-wrap:wrap}
              .chip{padding:3px 8px;border-radius:999px;font-size:12px;font-weight:700;border:1px solid}
              .chip.city{background:rgba(15,23,42,.06);color:#0f172a;border-color:rgba(15,23,42,.12)}
              .chip.s-bargain{background:#ffe4e6;color:#9f1239;border-color:#fecdd3}
              .chip.s-cheap{background:#ecfeff;color:#155e75;border-color:#a5f3fc}
              .chip.s-normal{background:#f8fafc;color:#475569;border-color:#cbd5e1}
              .table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
              table{width:100%;min-width:1120px;border-collapse:collapse;font-size:13px}
              th,td{border-bottom:1px solid #edf1f7;padding:8px 10px;text-align:left;vertical-align:top}
              th{background:#f8fafc;color:#475569}
              th.sortable{cursor:pointer;user-select:none}
              th.sortable .sort-indicator{margin-left:4px;color:#94a3b8;font-size:11px;font-weight:700}
              th.sortable.active .sort-indicator{color:#0f172a}
              td.price{font-weight:800;white-space:nowrap}
              td.dim{color:var(--muted);white-space:nowrap}
              .badge{display:inline-block;padding:3px 7px;border-radius:999px;font-size:11px;font-weight:800;border:1px solid}
              .b-bargain{background:#ffe4e6;color:#9f1239;border-color:#fecdd3}
              .b-cheap{background:#ecfeff;color:#155e75;border-color:#a5f3fc}
              .b-normal{background:#f8fafc;color:#475569;border-color:#cbd5e1}
              .status-active{background:#eff6ff;color:#1d4ed8;border-color:#bfdbfe}
              .status-relisted{background:#f0fdf4;color:#166534;border-color:#bbf7d0}
              .diff-neg{color:#16a34a;font-weight:700}
              .diff-pos{color:#dc2626;font-weight:700}
              .empty{background:#fff;border:1px dashed #cbd5e1;border-radius:12px;padding:24px;color:#64748b;text-align:center}
              a{color:#1f6feb;text-decoration:none} a:hover{text-decoration:underline}
              @media (max-width:1280px){.toolbar{grid-template-columns:repeat(4,minmax(0,1fr))}.stats{grid-template-columns:repeat(3,minmax(0,1fr))}}
              @media (max-width:900px){
                body{padding:12px}
                h1{font-size:24px}
                .meta{font-size:13px}
                .legend{font-size:12px}
                .toolbar{grid-template-columns:1fr;padding:10px}
                .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
                .stat{padding:10px}
                .stat .v{font-size:18px}
                .head{flex-direction:column;align-items:flex-start}
                .table-wrap{overflow-x:visible}
                table{min-width:0}
                table, thead, tbody, tr, th, td{display:block;width:100%}
                thead{display:none}
                tbody{padding:8px}
                tr{background:#fff;border:1px solid #e5eaf3;border-radius:12px;padding:8px;margin-bottom:10px}
                td{display:flex;gap:10px;justify-content:space-between;align-items:flex-start;border:0;border-bottom:1px dashed #edf1f7;padding:6px 2px;white-space:normal}
                td:last-child{border-bottom:0}
                td::before{content:attr(data-label);min-width:84px;flex:0 0 84px;color:#64748b;font-weight:700}
                td.price{white-space:normal}
                td.dim{white-space:normal}
              }
            </style>
          </head>
          <body>
            <div class=\"wrap\">
              <h1>오늘의 아파트 매물 리포트</h1>
              <div class=\"meta\">기준시각: __RUN_LABEL__ / 노출 매물 __TOTAL__건 / 필터: __FILTER__</div>
              <div class=\"legend\">평균대비 = (매물가 - 단지평균가) / 단지평균가 × 100 · 급매: __BARGAIN_TH__% 이하 · 저렴: __CHEAP_TH__% 이하 · 세대수 0은 정책상 비공개(상세보기 이용)</div>

              <div class=\"toolbar\">
                <select id=\"city\"></select>
                <select id=\"region\"></select>
                <select id=\"priceBand\"><option value=\"\">가격대(전체)</option><option>8억 미만</option><option>8~9억대</option><option>9~10억대</option><option>10~12억대</option><option>12억 이상</option></select>
                <select id=\"pyeongBand\"><option value=\"\">평형(공급,전체)</option><option>20평대</option><option>30평대</option></select>
                <select id=\"householdBand\"><option value=\"\">세대수(전체)</option><option value=\"le300\">300세대 이하</option><option value=\"r300_500\">300~500세대</option><option value=\"r500_700\">500~700세대</option><option value=\"ge700\">700세대 이상</option><option value=\"policy_hidden\">정책상 비공개(상세보기)</option></select>
                <select id=\"signal\"><option value=\"\">판단(전체)</option><option>급매</option><option>저렴</option><option>보통</option></select>
                <select id=\"status\"><option value=\"\">상태(전체)</option><option>판매중</option><option>다시 등록된 매물(판매중)</option></select>
                <input id=\"q\" placeholder=\"지역/단지명 검색\"/>
                <button id=\"resetBtn\">필터 초기화</button>
              </div>

              <div class=\"stats\">
                <div class=\"stat\"><div class=\"k\">노출 매물</div><div class=\"v\" id=\"sTotal\">0</div></div>
                <div class=\"stat\"><div class=\"k\">지역 수</div><div class=\"v\" id=\"sRegions\">0</div></div>
                <div class=\"stat\"><div class=\"k\">급매</div><div class=\"v\" id=\"sBargain\">0</div></div>
                <div class=\"stat\"><div class=\"k\">저렴</div><div class=\"v\" id=\"sCheap\">0</div></div>
                <div class=\"stat\"><div class=\"k\">다시 등록된 매물(판매중)</div><div class=\"v\" id=\"sRelisted\">__RELISTED__</div></div>
                <div class=\"stat\"><div class=\"k\">거래종결 후보</div><div class=\"v\">__CANDIDATE__</div></div>
                <div class=\"stat\"><div class=\"k\">거래종결 추정</div><div class=\"v\">__OFFMARKET__</div></div>
              </div>

              <div id=\"regions\"></div>
            </div>

            <script>
              const RAW = __DATA__;
              const cityEl=document.getElementById('city'),regionEl=document.getElementById('region'),priceEl=document.getElementById('priceBand'),pyeongEl=document.getElementById('pyeongBand'),householdEl=document.getElementById('householdBand'),signalEl=document.getElementById('signal'),statusEl=document.getElementById('status'),qEl=document.getElementById('q'),regionsEl=document.getElementById('regions');
              const resetBtn=document.getElementById('resetBtn');
              const sTotal=document.getElementById('sTotal'),sRegions=document.getElementById('sRegions'),sBargain=document.getElementById('sBargain'),sCheap=document.getElementById('sCheap');
              const CITY_COLOR={"수원":"#2563eb","용인수지":"#0f766e","서울양천":"#9333ea","서울강서":"#0284c7","서울영등포":"#0891b2","서울동작":"#dc2626","서울관악":"#ea580c","서울구로":"#16a34a","서울금천":"#ca8a04","서울성동":"#4f46e5","서울마포":"#7c3aed","서울용산":"#be123c","서울은평":"#0d9488","서울강동":"#1d4ed8","서울동대문":"#c2410c","서울광진":"#7e22ce","서울서대문":"#0f766e","서울성북":"#475569","성남판교":"#0f766e","성남분당":"#2563eb","성남수정":"#be123c","성남중원":"#0891b2","안양":"#ea580c"};
              const SORT_DEFAULT={key:'price',dir:'asc'};
              const FIRST_DIR={city:'asc',title:'asc',price:'asc',avgPrice:'desc',diffPct:'asc',signal:'asc',statusLabel:'asc',hsehCnt:'desc',areaSupplyPyeong:'desc'};
              const sortState={...SORT_DEFAULT};
              const esc=(s)=>String(s??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;');
              const uniq=(a)=>Array.from(new Set(a)).sort((x,y)=>String(x).localeCompare(String(y),'ko'));
              const mapUrl=(row)=>`https://map.naver.com/p/search/${encodeURIComponent(`${row.region} ${row.title}`)}`;
              const signalClass=(v)=>v==='급매'?'b-bargain':(v==='저렴'?'b-cheap':'b-normal');
              const statusClass=(v)=>v==='다시 등록된 매물(판매중)'?'status-relisted':'status-active';
              function cityColor(city){ if(CITY_COLOR[city]) return CITY_COLOR[city]; const palette=["#2563eb","#0f766e","#9333ea","#0284c7","#dc2626","#16a34a","#ea580c"]; let h=0; for(const c of city) h=(h*31+c.charCodeAt(0))>>>0; return palette[h%palette.length]; }
              function fillCities(){const c=uniq(RAW.map(x=>x.city));cityEl.innerHTML=`<option value="">도시(전체)</option>`+c.map(v=>`<option>${esc(v)}</option>`).join('');}
              function fillRegions(){const city=cityEl.value;const src=city?RAW.filter(x=>x.city===city):RAW;const r=uniq(src.map(x=>x.region));const prev=regionEl.value;regionEl.innerHTML=`<option value="">지역(전체)</option>`+r.map(v=>`<option>${esc(v)}</option>`).join('');if(r.includes(prev))regionEl.value=prev;}
              function householdMatch(h, band){
                const n=Number(h||0);
                if(!band) return true;
                if(band==='policy_hidden') return n<=0;
                if(n<=0) return false;
                if(band==='le300') return n<=300;
                if(band==='r300_500') return n>=300 && n<500;
                if(band==='r500_700') return n>=500 && n<700;
                if(band==='ge700') return n>=700;
                return true;
              }
              function householdText(h){
                const n=Number(h||0);
                return n>0 ? `${n}세대` : '정책상 비공개(상세보기)';
              }
              function filtered(){const city=cityEl.value,region=regionEl.value,priceBand=priceEl.value,pyeongBand=pyeongEl.value,householdBand=householdEl.value,signal=signalEl.value,status=statusEl.value,q=qEl.value.trim().toLowerCase();return RAW.filter(x=>{if(city&&x.city!==city)return false;if(region&&x.region!==region)return false;if(priceBand&&x.priceBand!==priceBand)return false;if(pyeongBand&&x.pyeongBand!==pyeongBand)return false;if(!householdMatch(x.hsehCnt,householdBand))return false;if(signal&&x.signal!==signal)return false;if(status&&x.statusLabel!==status)return false;if(q&&!`${x.region} ${x.title}`.toLowerCase().includes(q))return false;return true;});}
              function compareRows(a,b,key){
                if(['city','title','signal','statusLabel','region'].includes(key)){
                  return String(a[key]??'').localeCompare(String(b[key]??''),'ko');
                }
                const an=Number(a[key]??0), bn=Number(b[key]??0);
                if(!Number.isFinite(an) || !Number.isFinite(bn)) return 0;
                return an-bn;
              }
              function sortRows(rows){
                const arr=[...rows];
                arr.sort((a,b)=>{
                  const cmp=compareRows(a,b,sortState.key);
                  if(cmp!==0) return sortState.dir==='asc' ? cmp : -cmp;
                  return Number(a.price)-Number(b.price);
                });
                return arr;
              }
              function sortIndicator(key){
                if(sortState.key!==key) return '↕';
                return sortState.dir==='asc' ? '↑' : '↓';
              }
              function diffText(v){const n=Number(v||0);const sign=n>0?'+':'';return `${sign}${n.toFixed(1)}%`;}
              function diffClass(v){return Number(v)<=0?'diff-neg':'diff-pos';}
              function render(){
                const rows=sortRows(filtered());
                const g=new Map();
                for(const r of rows){if(!g.has(r.region))g.set(r.region,[]);g.get(r.region).push(r);}

                sTotal.textContent=String(rows.length);
                sRegions.textContent=String(g.size);
                sBargain.textContent=String(rows.filter(x=>x.signal==='급매').length);
                sCheap.textContent=String(rows.filter(x=>x.signal==='저렴').length);

                if(!rows.length){regionsEl.innerHTML='<div class="empty">조건에 맞는 데이터가 없습니다.</div>';return;}

                regionsEl.innerHTML=[...g.entries()].map(([name,items])=>{
                  const city=items[0]?.city||'';
                  const accent=cityColor(city);
                  const countBargain=items.filter(x=>x.signal==='급매').length;
                  const countCheap=items.filter(x=>x.signal==='저렴').length;
                  const countNormal=items.filter(x=>x.signal==='보통').length;
                  const chips=`<span class="chip city">${esc(city)}</span><span class="chip s-bargain">급매 ${countBargain}</span><span class="chip s-cheap">저렴 ${countCheap}</span><span class="chip s-normal">보통 ${countNormal}</span>`;

                  const rowsHtml=items.map(it=>`<tr><td data-label="도시">${esc(it.city)}</td><td data-label="단지/매물">${esc(it.title)}</td><td data-label="매물가" class="price">${esc(it.priceText)}</td><td data-label="단지 평균가">${esc(it.avgPriceText)}</td><td data-label="평균대비" class="${diffClass(it.diffPct)}">${esc(diffText(it.diffPct))}</td><td data-label="판단"><span class="badge ${signalClass(it.signal)}">${esc(it.signal)}</span></td><td data-label="상태"><span class="badge ${statusClass(it.statusLabel)}">${esc(it.statusLabel)}</span></td><td data-label="세대수" class="dim">${esc(householdText(it.hsehCnt))}</td><td data-label="공급/전용(평)" class="dim">${esc(it.areaSupplyPyeongText)}/${esc(it.areaExclusivePyeongText)}평</td><td data-label="층" class="dim">${esc(it.floor)}</td><td data-label="매물"><a href="${esc(it.url)}" target="_blank">상세보기</a></td><td data-label="지도"><a href="${esc(mapUrl(it))}" target="_blank">지도</a></td></tr>`).join('');

                  const headerCell=(label,key='')=>{
                    if(!key) return `<th>${label}</th>`;
                    const active=sortState.key===key ? 'active' : '';
                    return `<th class="sortable ${active}" data-sort="${key}">${label}<span class="sort-indicator">${sortIndicator(key)}</span></th>`;
                  };
                  const headerHtml=`<tr>${headerCell('도시','city')}${headerCell('단지/매물','title')}${headerCell('매물가','price')}${headerCell('단지 평균가','avgPrice')}${headerCell('평균대비','diffPct')}${headerCell('판단','signal')}${headerCell('상태','statusLabel')}${headerCell('세대수','hsehCnt')}${headerCell('공급/전용(평)','areaSupplyPyeong')}${headerCell('층')}${headerCell('매물')}${headerCell('지도')}</tr>`;

                  return `<section class="region" style="--accent:${accent};"><div class="head"><div class="title">${esc(name)} <span style="color:#64748b;font-size:13px;">(${items.length}건)</span></div><div class="chips">${chips}</div></div><div class="table-wrap"><table><thead>${headerHtml}</thead><tbody>${rowsHtml}</tbody></table></div></section>`;
                }).join('');
              }

              regionsEl.addEventListener('click',(event)=>{
                const th=event.target.closest('th[data-sort]');
                if(!th) return;
                const key=th.dataset.sort;
                if(!key) return;
                if(sortState.key===key){
                  sortState.dir = sortState.dir==='asc' ? 'desc' : 'asc';
                }else{
                  sortState.key = key;
                  sortState.dir = FIRST_DIR[key] || 'asc';
                }
                render();
              });

              cityEl.addEventListener('change',()=>{fillRegions();render();});
              [regionEl,priceEl,pyeongEl,householdEl,signalEl,statusEl].forEach(el=>el.addEventListener('change',render));
              qEl.addEventListener('input',render);
              resetBtn.addEventListener('click',()=>{cityEl.value='';fillRegions();regionEl.value='';priceEl.value='';pyeongEl.value='';householdEl.value='';signalEl.value='';statusEl.value='';qEl.value='';sortState.key=SORT_DEFAULT.key;sortState.dir=SORT_DEFAULT.dir;render();});

              fillCities();
              fillRegions();
              render();
            </script>
          </body>
          </html>
          """

          html_doc = (
              html_template
              .replace("__DATA__", data_json)
              .replace("__TOTAL__", str(len(report_rows)))
              .replace("__FILTER__", html.escape(region_filter) if region_filter else "없음")
              .replace("__RUN_LABEL__", run_label)
              .replace("__BARGAIN_TH__", str(BARGAIN_THRESHOLD_PCT))
              .replace("__CHEAP_TH__", str(CHEAP_THRESHOLD_PCT))
              .replace("__RELISTED__", str(status_counts["RELISTED"]))
              .replace("__CANDIDATE__", str(status_counts["OFF_MARKET_CANDIDATE"]))
              .replace("__OFFMARKET__", str(status_counts["OFF_MARKET"]))
          )

          out_dir = pathlib.Path("pages")
          out_dir.mkdir(parents=True, exist_ok=True)
          (out_dir / "index.html").write_text(html_doc, encoding="utf-8")

          github_output = os.getenv("GITHUB_OUTPUT")
          if github_output:
              with open(github_output, "a", encoding="utf-8") as fo:
                  fo.write(f"total_count={len(report_rows)}\n")
                  fo.write(f"bargain_count={bargain_count}\n")
                  fo.write(f"cheap_count={cheap_count}\n")
                  fo.write(f"relisted_count={status_counts['RELISTED']}\n")
                  fo.write(f"off_market_candidate_count={status_counts['OFF_MARKET_CANDIDATE']}\n")
                  fo.write(f"off_market_count={status_counts['OFF_MARKET']}\n")
                  fo.write(f"run_label={run_label}\n")

          print(
              "report rows=%s, bargain=%s, cheap=%s, relisted=%s, candidate=%s, off_market=%s"
              % (
                  len(report_rows),
                  bargain_count,
                  cheap_count,
                  status_counts["RELISTED"],
                  status_counts["OFF_MARKET_CANDIDATE"],
                  status_counts["OFF_MARKET"],
              )
          )
          print("generated pages/index.html")
          PY

      - name: Ensure Pages archive tools (self-hosted macOS)
        shell: bash
        run: |
          if ! command -v gtar >/dev/null 2>&1; then
            brew install gnu-tar
          fi
          if ! command -v zstd >/dev/null 2>&1; then
            brew install zstd
          fi
          echo "gtar: $(command -v gtar)"
          echo "zstd: $(command -v zstd)"

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages

  deploy-pages:
    needs: build-report
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  notify:
    needs: [build-report, deploy-pages]
    runs-on: [self-hosted, macOS, ARM64]
    permissions:
      contents: read
    env:
      TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
      PAGE_URL: ${{ needs.deploy-pages.outputs.page_url }}
      TOTAL_COUNT: ${{ needs.build-report.outputs.total_count }}
      BARGAIN_COUNT: ${{ needs.build-report.outputs.bargain_count }}
      CHEAP_COUNT: ${{ needs.build-report.outputs.cheap_count }}
      RELISTED_COUNT: ${{ needs.build-report.outputs.relisted_count }}
      OFF_MARKET_CANDIDATE_COUNT: ${{ needs.build-report.outputs.off_market_candidate_count }}
      OFF_MARKET_COUNT: ${{ needs.build-report.outputs.off_market_count }}
      RUN_LABEL: ${{ needs.build-report.outputs.run_label }}
      REGION_FILTER: ${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.region_filter || '') || '' }}

    steps:
      - name: Send single Teams notification with report link
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys
          import urllib.request

          webhook = (os.getenv("TEAMS_WEBHOOK_URL") or "").strip()
          if not webhook:
              print("TEAMS_WEBHOOK_URL secret is empty")
              sys.exit(1)

          page_url = (os.getenv("PAGE_URL") or "").strip()
          total_count = os.getenv("TOTAL_COUNT", "0")
          bargain_count = os.getenv("BARGAIN_COUNT", "0")
          cheap_count = os.getenv("CHEAP_COUNT", "0")
          relisted_count = os.getenv("RELISTED_COUNT", "0")
          candidate_count = os.getenv("OFF_MARKET_CANDIDATE_COUNT", "0")
          off_market_count = os.getenv("OFF_MARKET_COUNT", "0")
          run_label = os.getenv("RUN_LABEL", "")
          region_filter = (os.getenv("REGION_FILTER") or "").strip() or "없음"

          if not page_url:
              repository = (os.getenv("GITHUB_REPOSITORY") or "").strip()
              if repository and "/" in repository:
                  owner, repo = repository.split("/", 1)
                  page_url = f"https://{owner}.github.io/{repo}/"

          bargain_threshold = "-10.0%"
          cheap_threshold = "-5.0%"

          payload = {
              "type": "message",
              "attachments": [
                  {
                      "contentType": "application/vnd.microsoft.card.adaptive",
                      "contentUrl": None,
                      "content": {
                          "$schema": "http://adaptivecards.io/schemas/adaptive-card.json",
                          "type": "AdaptiveCard",
                          "version": "1.4",
                          "body": [
                              {
                                  "type": "TextBlock",
                                  "text": "오늘의 아파트 매물 리포트",
                                  "weight": "Bolder",
                                  "size": "Large",
                                  "wrap": True,
                              },
                              {
                                  "type": "TextBlock",
                                  "text": "핵심 요약만 전달합니다. 상세 매물은 웹 리포트에서 확인하세요.",
                                  "isSubtle": True,
                                  "spacing": "Small",
                                  "wrap": True,
                              },
                              {
                                  "type": "Container",
                                  "style": "emphasis",
                                  "bleed": True,
                                  "spacing": "Medium",
                                  "items": [
                                      {
                                          "type": "ColumnSet",
                                          "columns": [
                                              {
                                                  "type": "Column",
                                                  "width": "stretch",
                                                  "items": [
                                                      {"type": "TextBlock", "text": total_count, "weight": "Bolder", "size": "Medium", "horizontalAlignment": "Center"},
                                                      {"type": "TextBlock", "text": "노출 매물", "isSubtle": True, "spacing": "None", "horizontalAlignment": "Center"}
                                                  ]
                                              },
                                              {
                                                  "type": "Column",
                                                  "width": "stretch",
                                                  "items": [
                                                      {"type": "TextBlock", "text": bargain_count, "weight": "Bolder", "size": "Medium", "horizontalAlignment": "Center"},
                                                      {"type": "TextBlock", "text": "급매", "isSubtle": True, "spacing": "None", "horizontalAlignment": "Center"}
                                                  ]
                                              },
                                              {
                                                  "type": "Column",
                                                  "width": "stretch",
                                                  "items": [
                                                      {"type": "TextBlock", "text": cheap_count, "weight": "Bolder", "size": "Medium", "horizontalAlignment": "Center"},
                                                      {"type": "TextBlock", "text": "저렴", "isSubtle": True, "spacing": "None", "horizontalAlignment": "Center"}
                                                  ]
                                              },
                                              {
                                                  "type": "Column",
                                                  "width": "stretch",
                                                  "items": [
                                                      {"type": "TextBlock", "text": relisted_count, "weight": "Bolder", "size": "Medium", "horizontalAlignment": "Center"},
                                                      {"type": "TextBlock", "text": "다시 등록된 매물(판매중)", "isSubtle": True, "spacing": "None", "horizontalAlignment": "Center"}
                                                  ]
                                              }
                                          ]
                                      },
                                      {
                                          "type": "ColumnSet",
                                          "spacing": "Small",
                                          "columns": [
                                              {
                                                  "type": "Column",
                                                  "width": "stretch",
                                                  "items": [
                                                      {"type": "TextBlock", "text": candidate_count, "weight": "Bolder", "size": "Medium", "horizontalAlignment": "Center"},
                                                      {"type": "TextBlock", "text": "거래종결 후보", "isSubtle": True, "spacing": "None", "horizontalAlignment": "Center"}
                                                  ]
                                              },
                                              {
                                                  "type": "Column",
                                                  "width": "stretch",
                                                  "items": [
                                                      {"type": "TextBlock", "text": off_market_count, "weight": "Bolder", "size": "Medium", "horizontalAlignment": "Center"},
                                                      {"type": "TextBlock", "text": "거래종결 추정", "isSubtle": True, "spacing": "None", "horizontalAlignment": "Center"}
                                                  ]
                                              }
                                          ]
                                      }
                                  ]
                              },
                              {
                                  "type": "FactSet",
                                  "spacing": "Medium",
                                  "facts": [
                                      {"title": "기준시각", "value": run_label},
                                      {"title": "필터", "value": region_filter},
                                      {"title": "급매/저렴 기준", "value": f"{bargain_threshold} / {cheap_threshold}"},
                                      {"title": "평균대비", "value": "(매물가-단지평균가)/단지평균가"},
                                  ],
                              },
                          ],
                          "actions": [
                              {
                                  "type": "Action.OpenUrl",
                                  "title": "웹 리포트 열기",
                                  "url": page_url,
                              }
                          ],
                      },
                  }
              ],
          }

          body = json.dumps(payload, ensure_ascii=False).encode("utf-8")
          req = urllib.request.Request(
              webhook,
              data=body,
              headers={"Content-Type": "application/json"},
              method="POST",
          )

          with urllib.request.urlopen(req, timeout=30) as resp:
              status = getattr(resp, "status", None) or resp.getcode()
              print(f"teams status={status}, page_url={page_url}")
              if status < 200 or status >= 300:
                  raise SystemExit(f"Teams notify failed: {status}")
          PY
