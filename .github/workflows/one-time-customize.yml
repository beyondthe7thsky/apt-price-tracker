name: one-time-customize

on:
  push:
    paths:
      - ".github/workflows/one-time-customize.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply customizations
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          report = Path('.github/workflows/send-teams-from-json.yml')
          page = Path('pages/index.html')
          bot = Path('.github/workflows/apt-price-bot.yml')

          rt = report.read_text(encoding='utf-8')
          pt = page.read_text(encoding='utf-8')
          bt = bot.read_text(encoding='utf-8')

          # Fork page URLs
          rt = rt.replace('https://saechimdaeki.github.io/apt-price-tracker/', 'https://beyondthe7thsky.github.io/apt-price-tracker/')
          pt = pt.replace('https://saechimdaeki.github.io/apt-price-tracker/', 'https://beyondthe7thsky.github.io/apt-price-tracker/')

          # Price band calculation in report generator
          rt, n = re.subn(
              r'''          def price_band_label\(price\):\n(?:              .*\n)+?              return "12억 이상"''',
              '''          def price_band_label(price):\n              if price < 80_000:\n                  return "8억 미만"\n              if price < 90_000:\n                  return "8~9억대"\n              if price < 100_000:\n                  return "9~10억대"\n              if price < 120_000:\n                  return "10~12억대"\n              if price < 150_000:\n                  return "12~15억"\n              if price < 200_000:\n                  return "15~20억"\n              if price < 300_000:\n                  return "20~30억"\n              return "30억 이상"''',
              rt,
              count=1,
          )
          print('price_band_label replacements:', n)

          options_old = '<option>12억 이상</option>'
          options_new = '<option>12~15억</option><option>15~20억</option><option>20~30억</option><option>30억 이상</option>'
          rt = rt.replace(options_old, options_new)
          pt = pt.replace(options_old, options_new)

          # Current pages/index.html may use multi-line option markup
          if '12억 이상' in pt and '30억 이상' not in pt:
              pt = pt.replace('            <option>12억 이상</option>', '            <option>12~15억</option>\n            <option>15~20억</option>\n            <option>20~30억</option>\n            <option>30억 이상</option>')

          # Add priceBandFor helper and normalize legacy/detail URLs.
          def patch_js(text):
              if 'const priceBandFor=' not in text:
                  text = re.sub(
                      r'''(\s*const fullUrl=\(u\)=>\{[^\n]+\};)''',
                      '''\n              const fullUrl=(row)=>{const t=String(row?.url??'').trim(); const m=t.match(/(?:articles\\/|article\\/info\\/)(\\d+)/); if(m) return `https://m.land.naver.com/article/info/${m[1]}`; if(t.startsWith('/')) return `https://m.land.naver.com${t}`; if(t.includes('fin.land.naver.com/map')) return mapUrl(row); return t || mapUrl(row);};\n              const priceBandFor=(price)=>{const p=Number(price||0); if(p<80000)return '8억 미만'; if(p<90000)return '8~9억대'; if(p<100000)return '9~10억대'; if(p<120000)return '10~12억대'; if(p<150000)return '12~15억'; if(p<200000)return '15~20억'; if(p<300000)return '20~30억'; return '30억 이상';};''',
                      text,
                      count=1,
                  )
              text = text.replace('fullUrl(it.url)', 'fullUrl(it)')
              text = text.replace('if (priceBand && x.priceBand !== priceBand) return false;', 'if (priceBand && priceBandFor(x.price) !== priceBand) return false;')
              return text

          rt = patch_js(rt)
          pt = patch_js(pt)

          # Auto rebuild/deploy after successful collection run.
          if 'workflow_run:' not in rt:
              rt = rt.replace('on:\n', 'on:\n  workflow_run:\n    workflows: ["run"]\n    types: [completed]\n', 1)
          if "github.event.workflow_run.conclusion" not in rt:
              rt = rt.replace('jobs:\n  build-report:\n', "jobs:\n  build-report:\n    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}\n", 1)

          # Daily 08:30 KST schedule for collector.
          if 'cron: "30 23 * * *"' not in bt:
              bt = re.sub(
                  r'''on:\n(?:  # schedule:.*\n(?:  #.*\n)*)?  workflow_dispatch:''',
                  'on:\n  schedule:\n    # 매일 KST 08:30 = UTC 전날 23:30\n    - cron: "30 23 * * *"\n  workflow_dispatch:',
                  bt,
                  count=1,
              )
          bt = bt.replace('git rebase "origin/${BRANCH}"', 'git rebase -X theirs "origin/${BRANCH}"')

          report.write_text(rt, encoding='utf-8')
          page.write_text(pt, encoding='utf-8')
          bot.write_text(bt, encoding='utf-8')
          PY

      - name: Validate patched files
        run: |
          grep -q '30억 이상' .github/workflows/send-teams-from-json.yml
          grep -q '30억 이상' pages/index.html
          grep -q 'workflow_run:' .github/workflows/send-teams-from-json.yml
          grep -q 'cron: "30 23 \* \* \*"' .github/workflows/apt-price-bot.yml
          grep -q 'git rebase -X theirs' .github/workflows/apt-price-bot.yml

      - name: Commit patched files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/send-teams-from-json.yml .github/workflows/apt-price-bot.yml pages/index.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "feat: customize price bands links and automation"
            git push origin HEAD:main
          fi
