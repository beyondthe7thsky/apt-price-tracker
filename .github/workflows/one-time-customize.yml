name: one-time-customize

on:
  push:
    paths:
      - ".github/workflows/one-time-customize.yml"

permissions:
  contents: write
  actions: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply direct modifications
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          report = Path('.github/workflows/send-teams-from-json.yml')
          page = Path('pages/index.html')
          bot = Path('.github/workflows/apt-price-bot.yml')

          rt = report.read_text(encoding='utf-8')
          pt = page.read_text(encoding='utf-8')
          bt = bot.read_text(encoding='utf-8')

          # 1) Fork URL metadata
          rt = rt.replace('https://saechimdaeki.github.io/apt-price-tracker/', 'https://beyondthe7thsky.github.io/apt-price-tracker/')
          pt = pt.replace('https://saechimdaeki.github.io/apt-price-tracker/', 'https://beyondthe7thsky.github.io/apt-price-tracker/')

          # 2) Price bands: 12~15 / 15~20 / 20~30 / 30+
          new_price_func = '''          def price_band_label(price):
              if price < 80_000:
                  return "8억 미만"
              if price < 90_000:
                  return "8~9억대"
              if price < 100_000:
                  return "9~10억대"
              if price < 120_000:
                  return "10~12억대"
              if price < 150_000:
                  return "12~15억"
              if price < 200_000:
                  return "15~20억"
              if price < 300_000:
                  return "20~30억"
              return "30억 이상"

'''
          rt, count = re.subn(
              r'          def price_band_label\(price\):\n.*?(?=          def pyeong_band_label\(p\):)',
              new_price_func,
              rt,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit('Could not replace price_band_label')

          option_replacement = '<option>12~15억</option><option>15~20억</option><option>20~30억</option><option>30억 이상</option>'
          rt = rt.replace('<option>12억 이상</option>', option_replacement)
          pt = pt.replace('<option>12억 이상</option>', option_replacement)
          # pages/index.html may use line-broken options
          pt = pt.replace('            <option>12억 이상</option>', '            <option>12~15억</option>\n            <option>15~20억</option>\n            <option>20~30억</option>\n            <option>30억 이상</option>')

          # 3) Always create detail URL from articleNo during report generation.
          old_url_line = '                      "url": compact_url(it.get("url", "")),'
          new_url_line = '                      "url": (f"/article/info/{str(it.get(\'articleNo\', \'\')).strip()}" if str(it.get("articleNo", "")).strip() else compact_url(it.get("url", ""))),'
          if old_url_line in rt:
              rt = rt.replace(old_url_line, new_url_line, 1)

          # 4) Report auto-runs after collector completes successfully.
          if 'workflow_run:' not in rt:
              rt = rt.replace('on:\n', 'on:\n  workflow_run:\n    workflows: ["run"]\n    types: [completed]\n', 1)
          if "github.event.workflow_run.conclusion == 'success'" not in rt:
              rt = rt.replace(
                  'jobs:\n  build-report:\n',
                  "jobs:\n  build-report:\n    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}\n",
                  1,
              )

          # 5) Collector runs every day at 08:30 KST.
          bt, count = re.subn(
              r'on:\n.*?  workflow_dispatch:',
              'on:\n  schedule:\n    # 매일 KST 08:30 = UTC 전날 23:30\n    - cron: "30 23 * * *"\n  workflow_dispatch:',
              bt,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit('Could not activate daily schedule')

          # 6) Prefer this run's data when a push/rebase conflict happens.
          bt = bt.replace('git rebase "origin/${BRANCH}"', 'git rebase -X theirs "origin/${BRANCH}"')

          report.write_text(rt, encoding='utf-8')
          page.write_text(pt, encoding='utf-8')
          bot.write_text(bt, encoding='utf-8')
          PY

      - name: Validate values
        shell: bash
        run: |
          grep -q 'return "12~15억"' .github/workflows/send-teams-from-json.yml
          grep -q 'return "15~20억"' .github/workflows/send-teams-from-json.yml
          grep -q 'return "20~30억"' .github/workflows/send-teams-from-json.yml
          grep -q 'return "30억 이상"' .github/workflows/send-teams-from-json.yml
          grep -q '<option>30억 이상</option>' pages/index.html
          grep -q 'workflow_run:' .github/workflows/send-teams-from-json.yml
          grep -Fq 'cron: "30 23 * * *"' .github/workflows/apt-price-bot.yml
          grep -Fq 'git rebase -X theirs "origin/${BRANCH}"' .github/workflows/apt-price-bot.yml
          grep -q '/article/info/' .github/workflows/send-teams-from-json.yml

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-time-customize.yml
          git add .github/workflows/send-teams-from-json.yml .github/workflows/apt-price-bot.yml pages/index.html
          git commit -m "feat: update price bands links and automation"
          git push origin HEAD:main

      - name: Rebuild GitHub Pages report
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run send-teams-from-json.yml --repo "$GITHUB_REPOSITORY"
