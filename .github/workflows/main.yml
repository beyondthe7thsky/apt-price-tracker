name: Apt Price Bot

on:
  schedule:
    # KST 09:00 (UTC 00:00), Monday-Friday
    - cron: "0 0 * * 1-5"
  workflow_dispatch:
    inputs:
      max_regions_per_run:
        description: "한 번 실행 시 수집할 최대 동 수 (안전 모드)"
        required: false
        default: "2"
      commit_data:
        description: "data/apt-listings.json 변경분 자동 커밋 여부"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: write

concurrency:
  group: apt-price-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      TZ: Asia/Seoul
      TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
      BOT_SAFE_MAX_REGIONS_PER_RUN: ${{ github.event.inputs.max_regions_per_run || '2' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x ./gradlew

      - name: Run bot
        run: ./gradlew --no-daemon clean bootRun

      - name: Commit updated data
        if: ${{ github.event.inputs.commit_data != 'false' }}
        run: |
          if [[ -n "$(git status --porcelain -- data/apt-listings.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/apt-listings.json
            git commit -m "chore: update apt listings data [skip ci]"
            git push
          else
            echo "No data changes to commit."
          fi

