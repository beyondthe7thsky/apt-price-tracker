name: run

on:
  schedule:
    # KST 08:30 (평일) = UTC 23:30 (일~목)
    - cron: "30 23 * * 0-4"
    # KST 11:30 (평일) = UTC 02:30 (월~금)
    - cron: "30 2 * * 1-5"
  workflow_dispatch:
    inputs:
      max_regions_per_run:
        description: "수동 실행 시 수집할 최대 동 수 (기본 0=전체 실행)"
        required: false
        default: "0"
      start_region_offset:
        description: "수동 실행 시 시작 동 오프셋 (기본 0)"
        required: false
        default: "0"
      commit_data:
        description: "data/apt-listings.json 변경분 자동 커밋 여부"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

jobs:
  run:
    runs-on: [self-hosted, macOS, ARM64]
    permissions:
      contents: write
    timeout-minutes: 180
    concurrency:
      group: apt-price-bot
      cancel-in-progress: false
    env:
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
      JAVA_TOOL_OPTIONS: -Dfile.encoding=UTF-8 -Dsun.jnu.encoding=UTF-8
      EVENT_NAME: ${{ github.event_name }}
      EVENT_SCHEDULE: ${{ github.event.schedule || '' }}
      INPUT_MAX_REGIONS: ${{ github.event.inputs.max_regions_per_run || '' }}
      INPUT_START_OFFSET: ${{ github.event.inputs.start_region_offset || '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x ./gradlew

      - name: Check locale
        run: |
          locale
          echo "JAVA_TOOL_OPTIONS=${JAVA_TOOL_OPTIONS}"

      - name: Resolve run config
        run: |
          if [[ "${EVENT_NAME}" == "schedule" ]]; then
            case "${EVENT_SCHEDULE}" in
              "30 23 * * 0-4")
                run_max="35"
                run_offset="0"
                ;;
              "30 2 * * 1-5")
                run_max="35"
                run_offset="35"
                ;;
              *)
                run_max="35"
                run_offset="0"
                ;;
            esac
          else
            run_max="${INPUT_MAX_REGIONS:-0}"
            run_offset="${INPUT_START_OFFSET:-0}"
          fi

          echo "RUN_MAX_REGIONS=${run_max}" >> "$GITHUB_ENV"
          echo "RUN_START_OFFSET=${run_offset}" >> "$GITHUB_ENV"
          echo "RUN_ROTATE_BY_DAY=true" >> "$GITHUB_ENV"
          echo "Resolved config: max=${run_max}, offset=${run_offset}, schedule=${EVENT_SCHEDULE}"

      - name: Run bot
        env:
          BOT_SAFE_MAX_REGIONS_PER_RUN: ${{ env.RUN_MAX_REGIONS }}
          BOT_SAFE_START_REGION_OFFSET: ${{ env.RUN_START_OFFSET }}
          BOT_SAFE_ROTATE_START_BY_DAY: ${{ env.RUN_ROTATE_BY_DAY }}
        run: ./gradlew --no-daemon clean bootRun

      - name: Commit updated data
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.commit_data != 'false') }}
        run: |
          BRANCH="${GITHUB_REF_NAME:-main}"

          if [[ -n "$(git status --porcelain data/apt-listings.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/apt-listings.json
            git commit -m "chore: update apt listings [skip ci]"

            pushed="false"
            for attempt in 1 2 3; do
              if git push origin "HEAD:${BRANCH}"; then
                pushed="true"
                break
              fi

              echo "Push rejected (attempt ${attempt}/3). Fetch + rebase and retry..."
              git fetch origin "${BRANCH}"
              if ! git rebase "origin/${BRANCH}"; then
                git rebase --abort || true
                echo "Rebase failed. Manual intervention required."
                exit 1
              fi
            done

            if [[ "${pushed}" != "true" ]]; then
              echo "Push failed after retries."
              exit 1
            fi
          else
            echo "No data changes to commit."
          fi
