name: run

on:
  # schedule:
  #   # KST 08:30 (평일) = UTC 23:30 (일~목)
  #   - cron: "30 23 * * 0-4"
  #   # KST 13:30 (평일) = UTC 04:30 (월~금)
  #   - cron: "30 4 * * 1-5"
  workflow_dispatch:
    inputs:
      region_scope:
        description: "실행할 지역 그룹"
        required: false
        default: "1) 수원시 (영통구, 광교, 화서)"
        type: choice
        options:
          - "1) 수원시 (영통구, 광교, 화서)"
          - "2) 용인시 수지구"
          - "3) 서울 마용성"
          - "4) 서울 서남권"
          - "5) 서울 남부"
          - "6) 서울 동부/서북권"
          - "7) 성남 전역"
          - "8) 안양권"
          - "9) 서울 강남3구"
      max_regions_per_run:
        description: "수동 실행 시 수집할 최대 동 수 (기본 0=전체 실행)"
        required: false
        default: "0"
      start_region_offset:
        description: "수동 실행 시 시작 동 오프셋 (비우면 이전 진행 위치 이어받기)"
        required: false
        default: ""
      max_complex_pages_on_overflow:
        description: "단지 매물량 많을 때 수집 최대 페이지 수 (기본 3, 권장 2~4)"
        required: false
        default: "3"
      max_complexes_per_region:
        description: "지역별 수집 최대 단지 수 (기본 0=전체, 권장 15~30)"
        required: false
        default: "0"
      max_overflow_complexes_per_region:
        description: "페이지 확장(overflow) 허용 단지 수 상한 (기본 4, 0=무제한)"
        required: false
        default: "4"
      article_order:
        description: "매물 정렬 요청 순서 (기본 prc, prc,date는 요청량 증가)"
        required: false
        default: "prc"
        type: choice
        options:
          - "prc"
          - "prc,date"
          - "date"
      max_run_minutes:
        description: "실행 최대 시간(분). 도달 시 안전 종료 후 다음 오프셋 저장 (기본 165)"
        required: false
        default: "165"
      auto_continue_on_time_budget:
        description: "시간 예산으로 종료되면 자동으로 다음 실행 이어받기"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      continue_chain_left:
        description: "자동 이어받기 남은 횟수 (기본 3)"
        required: false
        default: "3"
      parallel_mode:
        description: "지역 그룹 1~9를 병렬 실행 (수동 실행 전용)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      auto_continue_next_region_scope:
        description: "현재 지역 그룹 종료 후 다음 지역 그룹으로 자동 이어가기 (1→2→...→9)"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      commit_data:
        description: "data/apt-listings*.json 변경분 자동 커밋 여부"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

jobs:
  run:
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        region_shard: ${{ fromJSON((github.event_name == 'schedule' || github.event.inputs.parallel_mode == 'true') && '[1,2,3,4,5,6,7,8,9]' || '[1]') }}
    runs-on: [self-hosted, macOS, ARM64]
    permissions:
      actions: write
      contents: write
    timeout-minutes: 180
    concurrency:
      group: apt-price-bot-shard-${{ matrix.region_shard }}
      cancel-in-progress: false
    env:
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
      JAVA_TOOL_OPTIONS: -Dfile.encoding=UTF-8 -Dsun.jnu.encoding=UTF-8
      EVENT_NAME: ${{ github.event_name }}
      EVENT_SCHEDULE: ${{ github.event.schedule || '' }}
      INPUT_MAX_REGIONS: ${{ github.event.inputs.max_regions_per_run || '' }}
      INPUT_START_OFFSET: ${{ github.event.inputs.start_region_offset || '' }}
      INPUT_MAX_COMPLEX_PAGES_ON_OVERFLOW: ${{ github.event.inputs.max_complex_pages_on_overflow || '' }}
      INPUT_MAX_COMPLEXES_PER_REGION: ${{ github.event.inputs.max_complexes_per_region || '' }}
      INPUT_MAX_OVERFLOW_COMPLEXES_PER_REGION: ${{ github.event.inputs.max_overflow_complexes_per_region || '' }}
      INPUT_ARTICLE_ORDER: ${{ github.event.inputs.article_order || '' }}
      INPUT_MAX_RUN_MINUTES: ${{ github.event.inputs.max_run_minutes || '' }}
      INPUT_AUTO_CONTINUE_ON_TIME_BUDGET: ${{ github.event.inputs.auto_continue_on_time_budget || '' }}
      INPUT_CONTINUE_CHAIN_LEFT: ${{ github.event.inputs.continue_chain_left || '' }}
      INPUT_PARALLEL_MODE: ${{ github.event.inputs.parallel_mode || '' }}
      INPUT_AUTO_CONTINUE_NEXT_REGION_SCOPE: ${{ github.event.inputs.auto_continue_next_region_scope || '' }}
      INPUT_COMMIT_DATA: ${{ github.event.inputs.commit_data || '' }}
      INPUT_REGION_SCOPE: ${{ github.event.inputs.region_scope || '' }}
      MATRIX_REGION_SHARD: ${{ matrix.region_shard }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect preinstalled JDK 17
        id: detect_jdk
        run: |
          jdk17_home="$(/usr/libexec/java_home -v 17 2>/dev/null || true)"
          if [[ -n "${jdk17_home}" ]]; then
            echo "Using preinstalled JDK 17 at ${jdk17_home}"
            echo "JAVA_HOME=${jdk17_home}" >> "$GITHUB_ENV"
            echo "${jdk17_home}/bin" >> "$GITHUB_PATH"
            echo "use_preinstalled=true" >> "$GITHUB_OUTPUT"
          else
            echo "No preinstalled JDK 17 found. Fallback to setup-java."
            echo "use_preinstalled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up JDK 17 (fallback download)
        if: ${{ steps.detect_jdk.outputs.use_preinstalled != 'true' }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17.0.18"
          check-latest: false

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x ./gradlew

      - name: Check locale
        run: |
          locale
          echo "JAVA_TOOL_OPTIONS=${JAVA_TOOL_OPTIONS}"

      - name: Resolve run config
        run: |
          parallel_mode="${INPUT_PARALLEL_MODE:-false}"
          if [[ "${parallel_mode}" != "true" ]]; then
            parallel_mode="false"
          fi

          if [[ "${EVENT_NAME}" == "schedule" ]]; then
            run_shard="${MATRIX_REGION_SHARD:-1}"
          elif [[ "${parallel_mode}" == "true" ]]; then
            run_shard="${MATRIX_REGION_SHARD:-1}"
          else
            run_scope="${INPUT_REGION_SCOPE:-1) 수원시 (영통구, 광교, 화서)}"
            run_shard="$(echo "${run_scope}" | sed -E 's/^([0-9]+).*/\1/')"
          fi

          if ! [[ "${run_shard}" =~ ^[1-9]$ ]]; then
            run_shard="1"
          fi

          case "${run_shard}" in
            1) run_scope_label="수원시 (영통구, 광교, 화서)"; run_scope_input="1) 수원시 (영통구, 광교, 화서)" ;;
            2) run_scope_label="용인시 수지구"; run_scope_input="2) 용인시 수지구" ;;
            3) run_scope_label="서울 마용성"; run_scope_input="3) 서울 마용성" ;;
            4) run_scope_label="서울 서남권"; run_scope_input="4) 서울 서남권" ;;
            5) run_scope_label="서울 남부"; run_scope_input="5) 서울 남부" ;;
            6) run_scope_label="서울 동부/서북권"; run_scope_input="6) 서울 동부/서북권" ;;
            7) run_scope_label="성남 전역"; run_scope_input="7) 성남 전역" ;;
            8) run_scope_label="안양권"; run_scope_input="8) 안양권" ;;
            9) run_scope_label="서울 강남3구"; run_scope_input="9) 서울 강남3구" ;;
            *) run_scope_label="수원시 (영통구, 광교, 화서)"; run_scope_input="1) 수원시 (영통구, 광교, 화서)" ;;
          esac

          run_progress_file="data/run-progress-s${run_shard}.json"

          if [[ "${EVENT_NAME}" == "schedule" ]]; then
            run_max="0"
            run_overflow_pages="3"
            run_max_complexes="0"
            run_max_overflow_complexes="4"
            run_article_order="prc"
            run_max_minutes="165"
            run_rotate="false"
            run_offset="0"
            run_auto_continue="false"
            run_chain_left="0"
            run_auto_continue_next_scope="false"
            run_commit_data="true"

            if [[ -f "${run_progress_file}" ]]; then
              state_offset="$(python3 -c 'import json,pathlib,sys; p=pathlib.Path(sys.argv[1]); d=json.loads(p.read_text(encoding="utf-8")); print(int(d.get("nextStartRegionOffset",0)))' "${run_progress_file}" 2>/dev/null || echo 0)"
              if [[ "${state_offset}" =~ ^-?[0-9]+$ ]]; then
                run_offset="${state_offset}"
              fi
            fi
          else
            run_max="${INPUT_MAX_REGIONS:-0}"
            run_overflow_pages="${INPUT_MAX_COMPLEX_PAGES_ON_OVERFLOW:-3}"
            run_max_complexes="${INPUT_MAX_COMPLEXES_PER_REGION:-0}"
            run_max_overflow_complexes="${INPUT_MAX_OVERFLOW_COMPLEXES_PER_REGION:-4}"
            run_article_order="${INPUT_ARTICLE_ORDER:-prc}"
            run_max_minutes="${INPUT_MAX_RUN_MINUTES:-165}"
            run_rotate="false"
            if [[ "${parallel_mode}" == "true" ]]; then
              run_auto_continue="false"
              run_chain_left="0"
              run_auto_continue_next_scope="false"
            else
              run_auto_continue="${INPUT_AUTO_CONTINUE_ON_TIME_BUDGET:-true}"
              run_chain_left="${INPUT_CONTINUE_CHAIN_LEFT:-3}"
              run_auto_continue_next_scope="${INPUT_AUTO_CONTINUE_NEXT_REGION_SCOPE:-true}"
            fi
            run_commit_data="${INPUT_COMMIT_DATA:-true}"

            run_offset="${INPUT_START_OFFSET:-}"
            if [[ -z "${run_offset}" ]]; then
              run_offset="0"
              if [[ -f "${run_progress_file}" ]]; then
                state_offset="$(python3 -c 'import json,pathlib,sys; p=pathlib.Path(sys.argv[1]); d=json.loads(p.read_text(encoding="utf-8")); print(int(d.get("nextStartRegionOffset",0)))' "${run_progress_file}" 2>/dev/null || echo 0)"
                if [[ "${state_offset}" =~ ^-?[0-9]+$ ]]; then
                  run_offset="${state_offset}"
                fi
              fi
            fi
          fi

          if ! [[ "${run_chain_left}" =~ ^[0-9]+$ ]]; then
            run_chain_left="0"
          fi

          if [[ "${run_auto_continue}" != "true" ]]; then
            run_auto_continue="false"
          fi

          if [[ "${run_auto_continue_next_scope}" != "true" ]]; then
            run_auto_continue_next_scope="false"
          fi

          if [[ "${run_commit_data}" != "true" ]]; then
            run_commit_data="false"
          fi

          if ! [[ "${run_max_overflow_complexes}" =~ ^-?[0-9]+$ ]]; then
            run_max_overflow_complexes="4"
          fi

          case "${run_article_order}" in
            prc|date|prc,date) ;;
            *) run_article_order="prc" ;;
          esac

          if [[ "${run_auto_continue}" == "true" && "${run_commit_data}" != "true" ]]; then
            echo "auto-continue requires commit_data=true. Disabling auto-continue for this run."
            run_auto_continue="false"
          fi

          echo "RUN_MAX_REGIONS=${run_max}" >> "$GITHUB_ENV"
          echo "RUN_START_OFFSET=${run_offset}" >> "$GITHUB_ENV"
          echo "RUN_MAX_COMPLEX_PAGES_ON_OVERFLOW=${run_overflow_pages}" >> "$GITHUB_ENV"
          echo "RUN_MAX_COMPLEXES_PER_REGION=${run_max_complexes}" >> "$GITHUB_ENV"
          echo "RUN_MAX_OVERFLOW_COMPLEXES_PER_REGION=${run_max_overflow_complexes}" >> "$GITHUB_ENV"
          echo "RUN_ARTICLE_ORDER=${run_article_order}" >> "$GITHUB_ENV"
          echo "RUN_MAX_RUN_MINUTES=${run_max_minutes}" >> "$GITHUB_ENV"
          echo "RUN_AUTO_CONTINUE_ON_TIME_BUDGET=${run_auto_continue}" >> "$GITHUB_ENV"
          echo "RUN_CONTINUE_CHAIN_LEFT=${run_chain_left}" >> "$GITHUB_ENV"
          echo "RUN_AUTO_CONTINUE_NEXT_REGION_SCOPE=${run_auto_continue_next_scope}" >> "$GITHUB_ENV"
          echo "RUN_COMMIT_DATA=${run_commit_data}" >> "$GITHUB_ENV"
          echo "RUN_PARALLEL_MODE=${parallel_mode}" >> "$GITHUB_ENV"
          echo "RUN_ROTATE_BY_DAY=${run_rotate}" >> "$GITHUB_ENV"
          echo "RUN_REGION_SHARD=${run_shard}" >> "$GITHUB_ENV"
          echo "RUN_REGION_SCOPE_LABEL=${run_scope_label}" >> "$GITHUB_ENV"
          echo "RUN_REGION_SCOPE_INPUT=${run_scope_input}" >> "$GITHUB_ENV"
          echo "RUN_PROGRESS_FILE=${run_progress_file}" >> "$GITHUB_ENV"
          echo "Resolved config: shard=${run_shard} (${run_scope_label}), max=${run_max}, offset=${run_offset}, overflow_pages=${run_overflow_pages}, max_complexes=${run_max_complexes}, max_overflow_complexes=${run_max_overflow_complexes}, article_order=${run_article_order}, max_run_minutes=${run_max_minutes}, auto_continue=${run_auto_continue}, chain_left=${run_chain_left}, auto_continue_next_scope=${run_auto_continue_next_scope}, commit_data=${run_commit_data}, parallel_mode=${parallel_mode}, rotate=${run_rotate}, schedule=${EVENT_SCHEDULE}, progress_file=${run_progress_file}"

      - name: Run bot
        env:
          BOT_SAFE_MAX_REGIONS_PER_RUN: ${{ env.RUN_MAX_REGIONS }}
          BOT_SAFE_START_REGION_OFFSET: ${{ env.RUN_START_OFFSET }}
          BOT_SAFE_ROTATE_START_BY_DAY: ${{ env.RUN_ROTATE_BY_DAY }}
          BOT_SAFE_REGION_SHARD: ${{ env.RUN_REGION_SHARD }}
          BOT_SAFE_MAX_RUN_MINUTES: ${{ env.RUN_MAX_RUN_MINUTES }}
          NAVER_SAFE_MAX_COMPLEX_PAGES_ON_OVERFLOW: ${{ env.RUN_MAX_COMPLEX_PAGES_ON_OVERFLOW }}
          NAVER_SAFE_MAX_COMPLEXES_PER_REGION: ${{ env.RUN_MAX_COMPLEXES_PER_REGION }}
          NAVER_SAFE_MAX_OVERFLOW_COMPLEXES_PER_REGION: ${{ env.RUN_MAX_OVERFLOW_COMPLEXES_PER_REGION }}
          NAVER_SAFE_ARTICLE_ORDER: ${{ env.RUN_ARTICLE_ORDER }}
        run: ./gradlew --no-daemon bootRun

      - name: Commit updated data
        if: ${{ always() && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.commit_data != 'false')) }}
        run: |
          BRANCH="${GITHUB_REF_NAME:-main}"
          shopt -s nullglob
          files=(data/apt-listings*.json data/run-progress*.json)
          shopt -u nullglob

          if (( ${#files[@]} > 0 )) && [[ -n "$(git status --porcelain -- "${files[@]}")" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "${files[@]}"
            if git diff --cached --quiet; then
              echo "No data changes to commit."
              exit 0
            fi
            git commit -m "chore: update apt listings shard ${RUN_REGION_SHARD} [skip ci]"

            pushed="false"
            for attempt in 1 2 3; do
              if git push origin "HEAD:${BRANCH}"; then
                pushed="true"
                break
              fi

              echo "Push rejected (attempt ${attempt}/3). Fetch + rebase and retry..."
              git fetch origin "${BRANCH}"
              if ! git rebase "origin/${BRANCH}"; then
                git rebase --abort || true
                echo "Rebase failed. Manual intervention required."
                exit 1
              fi
            done

            if [[ "${pushed}" != "true" ]]; then
              echo "Push failed after retries."
              exit 1
            fi
          else
            echo "No data changes to commit."
          fi

      - name: Read run progress reason
        id: progress
        if: ${{ always() }}
        run: |
          reason=""
          next_offset=""
          if [[ -f "${RUN_PROGRESS_FILE}" ]]; then
            reason="$(python3 -c 'import json,pathlib,sys; p=pathlib.Path(sys.argv[1]); d=json.loads(p.read_text(encoding="utf-8")); print(d.get("reason",""))' "${RUN_PROGRESS_FILE}" 2>/dev/null || true)"
            next_offset="$(python3 -c 'import json,pathlib,sys; p=pathlib.Path(sys.argv[1]); d=json.loads(p.read_text(encoding="utf-8")); print(d.get("nextStartRegionOffset",""))' "${RUN_PROGRESS_FILE}" 2>/dev/null || true)"
          fi
          chain_left="${RUN_CONTINUE_CHAIN_LEFT:-0}"
          if ! [[ "${chain_left}" =~ ^[0-9]+$ ]]; then
            chain_left="0"
          fi
          if [[ "${chain_left}" -gt 0 ]]; then
            next_chain_left="$((chain_left - 1))"
          else
            next_chain_left="0"
          fi
          echo "reason=${reason}" >> "$GITHUB_OUTPUT"
          echo "next_offset=${next_offset}" >> "$GITHUB_OUTPUT"
          echo "chain_left=${chain_left}" >> "$GITHUB_OUTPUT"
          echo "next_chain_left=${next_chain_left}" >> "$GITHUB_OUTPUT"
          echo "Run progress reason=${reason}, nextOffset=${next_offset}, chain_left=${chain_left}, next_chain_left=${next_chain_left}"

      - name: Auto-dispatch follow-up run
        if: ${{ success() && github.event_name == 'workflow_dispatch' && env.RUN_PARALLEL_MODE != 'true' && env.RUN_AUTO_CONTINUE_ON_TIME_BUDGET == 'true' && startsWith(steps.progress.outputs.reason, 'TIME_BUDGET') && steps.progress.outputs.chain_left != '0' && env.RUN_COMMIT_DATA == 'true' }}
        uses: actions/github-script@v7
        env:
          NEXT_CONTINUE_CHAIN_LEFT: ${{ steps.progress.outputs.next_chain_left }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: "apt-price-bot.yml",
              ref: context.ref.replace("refs/heads/", ""),
              inputs: {
                region_scope: process.env.RUN_REGION_SCOPE_INPUT,
                max_regions_per_run: process.env.RUN_MAX_REGIONS,
                start_region_offset: "",
                max_complex_pages_on_overflow: process.env.RUN_MAX_COMPLEX_PAGES_ON_OVERFLOW,
                max_complexes_per_region: process.env.RUN_MAX_COMPLEXES_PER_REGION,
                max_overflow_complexes_per_region: process.env.RUN_MAX_OVERFLOW_COMPLEXES_PER_REGION,
                article_order: process.env.RUN_ARTICLE_ORDER,
                max_run_minutes: process.env.RUN_MAX_RUN_MINUTES,
                auto_continue_on_time_budget: process.env.RUN_AUTO_CONTINUE_ON_TIME_BUDGET,
                continue_chain_left: process.env.NEXT_CONTINUE_CHAIN_LEFT,
                auto_continue_next_region_scope: process.env.RUN_AUTO_CONTINUE_NEXT_REGION_SCOPE,
                commit_data: process.env.RUN_COMMIT_DATA
              }
            });
            core.info(`Dispatched follow-up run (chain left: ${process.env.NEXT_CONTINUE_CHAIN_LEFT})`);

      - name: Auto-dispatch next region scope
        if: ${{ success() && github.event_name == 'workflow_dispatch' && env.RUN_PARALLEL_MODE != 'true' && env.RUN_AUTO_CONTINUE_NEXT_REGION_SCOPE == 'true' && env.RUN_COMMIT_DATA == 'true' && !startsWith(steps.progress.outputs.reason, 'TIME_BUDGET') && env.RUN_REGION_SHARD != '9' }}
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const currentShard = Number(process.env.RUN_REGION_SHARD || "0");
            const nextShard = currentShard + 1;
            const scopeByShard = {
              1: "1) 수원시 (영통구, 광교, 화서)",
              2: "2) 용인시 수지구",
              3: "3) 서울 마용성",
              4: "4) 서울 서남권",
              5: "5) 서울 남부",
              6: "6) 서울 동부/서북권",
              7: "7) 성남 전역",
              8: "8) 안양권",
              9: "9) 서울 강남3구"
            };
            const nextScope = scopeByShard[nextShard];
            if (!nextScope) {
              core.info(`No next scope for shard=${currentShard}. Skipping.`);
              return;
            }

            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: "apt-price-bot.yml",
              ref: context.ref.replace("refs/heads/", ""),
              inputs: {
                region_scope: nextScope,
                max_regions_per_run: process.env.RUN_MAX_REGIONS,
                start_region_offset: "",
                max_complex_pages_on_overflow: process.env.RUN_MAX_COMPLEX_PAGES_ON_OVERFLOW,
                max_complexes_per_region: process.env.RUN_MAX_COMPLEXES_PER_REGION,
                max_overflow_complexes_per_region: process.env.RUN_MAX_OVERFLOW_COMPLEXES_PER_REGION,
                article_order: process.env.RUN_ARTICLE_ORDER,
                max_run_minutes: process.env.RUN_MAX_RUN_MINUTES,
                auto_continue_on_time_budget: process.env.RUN_AUTO_CONTINUE_ON_TIME_BUDGET,
                continue_chain_left: process.env.RUN_CONTINUE_CHAIN_LEFT,
                parallel_mode: "false",
                auto_continue_next_region_scope: process.env.RUN_AUTO_CONTINUE_NEXT_REGION_SCOPE,
                commit_data: process.env.RUN_COMMIT_DATA
              }
            });
            core.info(`Dispatched next region scope: ${nextScope}`);
