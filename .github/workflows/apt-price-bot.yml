name: run

on:
  schedule:
    # UTC 00:00 = KST 09:00 (평일)
    - cron: "0 0 * * 1-5"
  workflow_dispatch:
    inputs:
      max_regions_per_run:
        description: "한 번 실행 시 수집할 최대 동 수 (전체 실행: 49)"
        required: false
        default: "49"
      commit_data:
        description: "data/apt-listings.json 변경분 자동 커밋 여부"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

jobs:
  run:
    runs-on: [self-hosted, macOS, ARM64]
    permissions:
      contents: write
    timeout-minutes: 180
    concurrency:
      group: apt-price-bot
      cancel-in-progress: false
    env:
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
      JAVA_TOOL_OPTIONS: -Dfile.encoding=UTF-8 -Dsun.jnu.encoding=UTF-8

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x ./gradlew

      - name: Check locale
        run: |
          locale
          echo "JAVA_TOOL_OPTIONS=${JAVA_TOOL_OPTIONS}"

      - name: Run bot
        env:
          BOT_SAFE_MAX_REGIONS_PER_RUN: ${{ github.event.inputs.max_regions_per_run || '49' }}
        run: ./gradlew --no-daemon clean bootRun

      - name: Commit updated data
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.commit_data != 'false') }}
        run: |
          BRANCH="${GITHUB_REF_NAME:-main}"

          if [[ -n "$(git status --porcelain data/apt-listings.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/apt-listings.json
            git commit -m "chore: update apt listings [skip ci]"

            pushed="false"
            for attempt in 1 2 3; do
              if git push origin "HEAD:${BRANCH}"; then
                pushed="true"
                break
              fi

              echo "Push rejected (attempt ${attempt}/3). Fetch + rebase and retry..."
              git fetch origin "${BRANCH}"
              if ! git rebase "origin/${BRANCH}"; then
                git rebase --abort || true
                echo "Rebase failed. Manual intervention required."
                exit 1
              fi
            done

            if [[ "${pushed}" != "true" ]]; then
              echo "Push failed after retries."
              exit 1
            fi
          else
            echo "No data changes to commit."
          fi
