spring:
  main:
    web-application-type: none

bot:
  enabled: true
  safe:
    max-regions-per-run: 50
    region-delay-min-ms: 3000
    region-delay-max-ms: 7000

naver:
  safe:
    max-attempts: 2
    base-backoff-ms: 2000
    backoff-jitter-ms: 1500
    max-complex-pages: 1
    max-complexes-per-region: 50
    complex-delay-min-ms: 700
    complex-delay-max-ms: 1500
    page-delay-min-ms: 300
    page-delay-max-ms: 900
    request-timeout-ms: 20000
    abuse-cooldown-minutes: 30
