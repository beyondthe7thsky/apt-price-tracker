spring:
  main:
    web-application-type: none

bot:
  enabled: true
  safe:
    max-regions-per-run: 0
    rotate-start-by-day: true
    start-region-offset: 0
    retry-region-after-abuse: true
    max-abuse-retry-per-region: 1
    max-abuse-wait-ms: 480000
    region-delay-min-ms: 4000
    region-delay-max-ms: 7000

naver:
  safe:
    max-attempts: 2
    base-backoff-ms: 2000
    backoff-jitter-ms: 1500
    article-order: prc,date
    max-complex-pages: 1
    max-complex-pages-on-overflow: 3
    max-overflow-complexes-per-region: 0
    max-complexes-per-region: 0
    rotate-complexes-by-day: true
    complex-delay-min-ms: 1200
    complex-delay-max-ms: 2200
    overflow-complex-delay-min-ms: 1200
    overflow-complex-delay-max-ms: 2400
    page-delay-min-ms: 500
    page-delay-max-ms: 1100
    request-timeout-ms: 20000
    abuse-cooldown-minutes: 8
