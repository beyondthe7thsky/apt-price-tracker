spring:
  main:
    web-application-type: none

bot:
  enabled: true
  safe:
    max-regions-per-run: 0
    rotate-start-by-day: true
    start-region-offset: 0
    region-delay-min-ms: 5000
    region-delay-max-ms: 9000

naver:
  safe:
    max-attempts: 2
    base-backoff-ms: 2000
    backoff-jitter-ms: 1500
    max-complex-pages: 1
    max-complexes-per-region: 35
    rotate-complexes-by-day: true
    complex-delay-min-ms: 1200
    complex-delay-max-ms: 2600
    page-delay-min-ms: 600
    page-delay-max-ms: 1500
    request-timeout-ms: 20000
    abuse-cooldown-minutes: 30
