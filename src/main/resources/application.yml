spring:
  main:
    web-application-type: none

bot:
  enabled: true
  safe:
    max-regions-per-run: 0
    rotate-start-by-day: true
    start-region-offset: 0
    retry-region-after-abuse: true
    max-abuse-retry-per-region: 1
    max-abuse-wait-ms: 480000
    region-delay-min-ms: 7000
    region-delay-max-ms: 12000

naver:
  safe:
    max-attempts: 2
    base-backoff-ms: 2000
    backoff-jitter-ms: 1500
    max-complex-pages: 1
    max-complexes-per-region: 20
    rotate-complexes-by-day: true
    complex-delay-min-ms: 1800
    complex-delay-max-ms: 3600
    page-delay-min-ms: 800
    page-delay-max-ms: 1800
    request-timeout-ms: 20000
    abuse-cooldown-minutes: 8
    household-fallback-enabled: true
    household-fallback-timeout-ms: 7000
    household-fallback-delay-min-ms: 250
    household-fallback-delay-max-ms: 700
    household-fallback-normal-sample-rate: 0.35
    household-fallback-degraded-sample-rate: 0.05
    household-fallback-429-window-ms: 180000
    household-fallback-429-threshold: 3
    household-fallback-degraded-duration-ms: 1200000
