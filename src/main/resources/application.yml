spring:
  main:
    web-application-type: none

bot:
  enabled: true
  safe:
    max-regions-per-run: 0
    rotate-start-by-day: true
    start-region-offset: 0
    retry-region-after-abuse: true
    max-abuse-retry-per-region: 1
    max-abuse-wait-ms: 300000
    replay-abuse-skipped-regions: true
    max-abuse-replay-rounds: 2
    region-delay-min-ms: 3000
    region-delay-max-ms: 6000

naver:
  safe:
    max-attempts: 2
    base-backoff-ms: 2000
    backoff-jitter-ms: 1500
    article-order: prc,date
    max-complex-pages: 1
    max-complex-pages-on-overflow: 3
    max-overflow-complexes-per-region: 0
    max-complexes-per-region: 0
    rotate-complexes-by-day: true
    complex-delay-min-ms: 700
    complex-delay-max-ms: 1500
    overflow-complex-delay-min-ms: 1000
    overflow-complex-delay-max-ms: 2200
    page-delay-min-ms: 500
    page-delay-max-ms: 1200
    request-timeout-ms: 20000
    abuse-cooldown-minutes: 5
